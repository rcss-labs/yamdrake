apiVersion: yumdrake/v1
kind: Job
job: deploy-web
title: "Deploy the web frontend"

environment:
  labels: [dev, preprod]

groups:
  web:
    label: Web frontend
    services: [web]

steps:
  - name: config
    use: copy-config
    group: web
  - name: roll
    use: ecs-deploy
    group: web
    timeout: 10m
    needs:
      - step: config
        scope: service
