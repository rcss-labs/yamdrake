# Local development services. Do not set a top-level `name:` so that separate
# worktrees stay separate Compose projects. Host ports and build arguments are
# overridable from the environment; scripts/smoke.sh uses that to run beside
# the development stack.
services:
  postgres:
    image: postgres:17.12-alpine
    environment:
      POSTGRES_DB: yumdrake
      POSTGRES_USER: yumdrake
      POSTGRES_PASSWORD: yumdrake
    ports:
      - "127.0.0.1:${YUMDRAKE_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yumdrake -d yumdrake"]
      interval: 2s
      timeout: 3s
      retries: 30
  valkey:
    image: valkey/valkey:8.1.12
    ports:
      - "127.0.0.1:${YUMDRAKE_VALKEY_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
  # One shared emulator for every worktree: start it only as
  # `docker compose -p plan5 up -d --wait floci`. Host port 4566 is deliberately
  # not published (another Floci may own it). ECS tasks and the ECR registry run
  # as sibling containers through the Docker socket.
  floci:
    image: floci/floci:2.5.0
    ports:
      - "127.0.0.1:4577:4566"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      FLOCI_HOSTNAME: floci
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 3s
      timeout: 3s
      retries: 10
  orchestrator:
    profiles: [app]
    image: yumdrake-orchestrator:dev
    build:
      context: .
      dockerfile: deploy/docker/orchestrator.Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-unknown}
    environment:
      YUMDRAKE_DATABASE_URL: postgres://yumdrake:yumdrake@postgres:5432/yumdrake?sslmode=disable
      YUMDRAKE_VALKEY_ADDR: valkey:6379
      # Development only: a fixed, public key. Real deployments must set their own secret.
      YUMDRAKE_LOCAL_SECRET_KEY: ZGV2LW9ubHktaW5zZWN1cmUta2V5LTMyLWJ5dGVzISE=
      # Development only: the address the browser uses; https:// is required
      # everywhere except localhost and 127.0.0.1.
      YUMDRAKE_PUBLIC_URL: http://localhost:${YUMDRAKE_ORCHESTRATOR_PORT:-8080}
      YUMDRAKE_SYNC_INTERVAL: ${YUMDRAKE_SYNC_INTERVAL:-60s}
      YUMDRAKE_GITHUB_API_URL: ${YUMDRAKE_GITHUB_API_URL:-https://api.github.com}
    ports:
      - "127.0.0.1:${YUMDRAKE_ORCHESTRATOR_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
  runner:
    profiles: [app]
    image: yumdrake-runner:dev
    build:
      context: .
      dockerfile: deploy/docker/runner.Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-unknown}
    environment:
      YUMDRAKE_DATABASE_URL: postgres://yumdrake:yumdrake@postgres:5432/yumdrake?sslmode=disable
      YUMDRAKE_VALKEY_ADDR: valkey:6379
      # Development only: a fixed, public key. Real deployments must set their own secret.
      YUMDRAKE_LOCAL_SECRET_KEY: ZGV2LW9ubHktaW5zZWN1cmUta2V5LTMyLWJ5dGVzISE=
      # Development only: the runner requires an artifact bucket name; nothing
      # creates it yet.
      YUMDRAKE_ARTIFACT_BUCKET: yumdrake-artifacts-dev
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
