# Local development services. Do not set a top-level `name:` so that separate
# worktrees stay separate Compose projects. Host ports and build arguments are
# overridable from the environment; scripts/smoke.sh uses that to run beside
# the development stack.
services:
  postgres:
    image: postgres:17.12-alpine
    environment:
      POSTGRES_DB: yumdrake
      POSTGRES_USER: yumdrake
      POSTGRES_PASSWORD: yumdrake
    ports:
      - "${YUMDRAKE_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yumdrake -d yumdrake"]
      interval: 2s
      timeout: 3s
      retries: 30
  valkey:
    image: valkey/valkey:8.1.12
    ports:
      - "${YUMDRAKE_VALKEY_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
  orchestrator:
    profiles: [app]
    image: yumdrake-orchestrator:dev
    build:
      context: .
      dockerfile: deploy/docker/orchestrator.Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-unknown}
    environment:
      YUMDRAKE_DATABASE_URL: postgres://yumdrake:yumdrake@postgres:5432/yumdrake?sslmode=disable
      YUMDRAKE_VALKEY_ADDR: valkey:6379
    ports:
      - "${YUMDRAKE_ORCHESTRATOR_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
  runner:
    profiles: [app]
    image: yumdrake-runner:dev
    build:
      context: .
      dockerfile: deploy/docker/runner.Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-unknown}
    environment:
      YUMDRAKE_DATABASE_URL: postgres://yumdrake:yumdrake@postgres:5432/yumdrake?sslmode=disable
      YUMDRAKE_VALKEY_ADDR: valkey:6379
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
