apiVersion: yumdrake/v1
kind: Job
job: deploy-api
title: "Deploy the API"

environment:
  labels: [dev, preprod, prod]

groups:
  api:
    label: API
    services: [api]

approval:
  when:
    labels: [prod]
  expires: 24h

steps:
  - name: config
    use: copy-config
    group: api
  - name: roll
    use: ecs-deploy
    group: api
    timeout: 15m
    needs:
      - step: config
        scope: service
