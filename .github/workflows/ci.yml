name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # install-only: `make lint` stays the single source of lint behaviour.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          install-only: true
      - run: make lint

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: make test
      - run: make cli-dist
      - run: ls dist

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Same image tags as compose.yaml.
    services:
      postgres:
        image: postgres:19.0-alpine3.24
        env:
          POSTGRES_DB: yumdrake
          POSTGRES_USER: yumdrake
          POSTGRES_PASSWORD: yumdrake
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yumdrake"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      valkey:
        image: valkey/valkey:9.2.1-alpine3.24
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      YUMDRAKE_TEST_DATABASE_URL: postgres://yumdrake:yumdrake@localhost:5432/yumdrake?sslmode=disable
      YUMDRAKE_TEST_VALKEY_ADDR: localhost:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: make test-integration
      - run: make test-e2e

  floci:
    runs-on: ubuntu-24.04
    # make test-floci (up to 10 minutes) and then the end-to-end tests with real
    # deployments (up to 45 minutes; they roll services in Floci containers).
    timeout-minutes: 60
    # Same services and image tags as the integration job (make test-floci also
    # runs the integration tests).
    services:
      postgres:
        image: postgres:19.0-alpine3.24
        env:
          POSTGRES_DB: yumdrake
          POSTGRES_USER: yumdrake
          POSTGRES_PASSWORD: yumdrake
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yumdrake"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      valkey:
        image: valkey/valkey:9.2.1-alpine3.24
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      YUMDRAKE_TEST_DATABASE_URL: postgres://yumdrake:yumdrake@localhost:5432/yumdrake?sslmode=disable
      YUMDRAKE_TEST_VALKEY_ADDR: localhost:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # Floci (the local AWS emulator) needs the Docker socket for ECS and ECR;
      # only the floci service starts, postgres and valkey are the services above.
      - name: Start Floci
        run: docker compose up -d --wait floci
      - run: make test-floci
      # The end-to-end planning and deployment tests against Floci; the endpoint on the command line enables them.
      - run: make test-e2e YUMDRAKE_TEST_AWS_ENDPOINT=http://localhost:4577
      - name: Show Floci logs on failure
        if: failure()
        run: docker compose logs floci

  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: make smoke

  terraform:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false
      # fmt and validate only: nothing is planned or applied, and no AWS credentials are present.
      - run: make tf-check

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make web-install web-lint web-test web-build

  web-e2e:
    runs-on: ubuntu-24.04
    # aws-runs.spec.ts seeds two AWS accounts into Floci and deploys for real, which takes several minutes.
    timeout-minutes: 35
    # Same services and image tags as the integration job.
    services:
      postgres:
        image: postgres:19.0-alpine3.24
        env:
          POSTGRES_DB: yumdrake
          POSTGRES_USER: yumdrake
          POSTGRES_PASSWORD: yumdrake
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yumdrake"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      valkey:
        image: valkey/valkey:9.2.1-alpine3.24
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      YUMDRAKE_TEST_DATABASE_URL: postgres://yumdrake:yumdrake@localhost:5432/yumdrake?sslmode=disable
      YUMDRAKE_TEST_VALKEY_ADDR: localhost:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make web-install
      - run: npx playwright install --with-deps chromium
        working-directory: web
      # Floci for aws-runs.spec.ts (real steps against a local AWS), as in the integration job.
      - name: Start Floci
        run: docker compose up -d --wait floci
      - run: make web-e2e
        env:
          YUMDRAKE_E2E_AWS_ENDPOINT: http://localhost:4577
      - name: Show Floci logs on failure
        if: failure()
        run: docker compose logs floci
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

  system:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # demo-check runs a browser test against the demo (web/e2e/demo.spec.ts), so it needs Node,
      # the web dependencies and Chromium. The images themselves build the web app inside Docker.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make web-install
      - run: npx playwright install --with-deps chromium
        working-directory: web
      # Builds the images and runs the production Compose setup and the demo for real: the demo's local AWS
      # (Floci) takes a deployment, a failure and a restore through the API, the CLI and the browser.
      - run: make compose-check demo-check
