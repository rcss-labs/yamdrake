apiVersion: yumdrake/v1
kind: Service
name: web
versions:
  pattern: '^v?\d+\.\d+\.\d+$'
  sort: semver
  limit: 50
environments:
  dev:
    ecs_service: arn:aws:ecs:us-east-1:111111111111:service/yd-c-web-demo-dev/web
    ecr_repository: 111111111111.dkr.ecr.us-east-1.amazonaws.com/yd-web-demo-dev
    env_files:
      - name: web.env
        source_env_path: demo-org/config/envs/dev/web.env
        destination_env_path: s3://yd-dst-demo-dev/web.env
    tomls:
      - name: web.toml
        source_toml_path: s3://yd-src-demo-dev/web.toml
        destination_toml_path: s3://yd-dst-demo-dev/web.toml
  qa:
    ecs_service: arn:aws:ecs:us-east-1:111111111111:service/yd-c-web-demo-qa/web
    ecr_repository: 111111111111.dkr.ecr.us-east-1.amazonaws.com/yd-web-demo-qa
    env_files:
      - name: web.env
        source_env_path: demo-org/config/envs/qa/web.env
        destination_env_path: s3://yd-dst-demo-qa/web.env
    tomls:
      - name: web.toml
        source_toml_path: s3://yd-src-demo-qa/web.toml
        destination_toml_path: s3://yd-dst-demo-qa/web.toml
  prod:
    ecs_service: arn:aws:ecs:us-east-1:222222222222:service/yd-c-web-demo-prod/web
    ecr_repository: 222222222222.dkr.ecr.us-east-1.amazonaws.com/yd-web-demo-prod
    env_files:
      - name: web.env
        source_env_path: demo-org/config/envs/prod/web.env
        destination_env_path: s3://yd-dst-demo-prod/web.env
    tomls:
      - name: web.toml
        source_toml_path: s3://yd-src-demo-prod/web.toml
        destination_toml_path: s3://yd-dst-demo-prod/web.toml
